name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Java Services ─────────────────────────────────────────
  inventory-service:
    name: Inventory Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: ./mvnw verify -B

  order-service:
    name: Order Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test
        run: ./mvnw verify -B

  # ── AI Forecasting Service ────────────────────────────────
  ai-forecasting-service:
    name: AI Forecasting Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-forecasting-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest test_brain.py -v

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Docker Build Verification ─────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [inventory-service, order-service, ai-forecasting-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build inventory-service image
        run: docker build -t predictive/inventory-service ./inventory-service

      - name: Build order-service image
        run: docker build -t predictive/order-service ./order-service

      - name: Build ai-forecasting-service image
        run: docker build -t predictive/ai-forecasting-service ./ai-forecasting-service

  # ── Continuous Deployment (CD) ────────────────────────────
  deploy:
    name: Deploy to Always-Free Oracle Cloud VM
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: SSH and Auto-Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_IP }}
          username: ${{ secrets.OCI_VM_USERNAME }}
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          script: |
            echo "--- Starting Continuous Deployment ---"
            
            # 1. Clone or update repository
            if [ ! -d "$HOME/predictive-inventory-system" ]; then
              echo "Cloning repository for the first time..."
              git clone https://github.com/vedgharat/predictive-inventory-system.git "$HOME/predictive-inventory-system"
            fi
            
            cd "$HOME/predictive-inventory-system"
            
            # 2. Pull the latest code changes
            echo "Pulling latest code changes from branch main..."
            git fetch --all
            git reset --hard origin/main
            
            # 3. Make provisioning script executable and run it
            echo "Running Oracle Cloud VM host provisioning..."
            chmod +x setup-oracle-vm.sh
            sudo ./setup-oracle-vm.sh
            
            # 4. Launch/Rebuild the containerized production stack
            echo "Rebuilding and starting containerized services in background..."
            docker compose up -d --build
            
            echo "--- Deployment Complete ---"
